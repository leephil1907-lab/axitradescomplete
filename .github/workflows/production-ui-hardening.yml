name: Production UI hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply production UI hardening
        run: node .github/scripts/production-ui-hardening.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Commit generated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminDashboardView.tsx src/components/PromotionsView.tsx .github/scripts/production-ui-hardening.mjs
          git diff --cached --quiet || git commit -m "feat: production promotions and admin operations"
          git push
