name: Admin payment production cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[admin-payment-cleanup]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply production cleanup
        run: node .github/scripts/admin-payment-production-cleanup.mjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/components/AdminDashboardView.tsx
          git diff --cached --quiet && exit 0
          git commit -m "chore: production admin payment controls [admin-payment-cleanup]"
          git push origin HEAD:main
