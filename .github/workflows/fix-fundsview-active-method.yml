name: Fix FundsView active payment method

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply FundsView null-safety patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/FundsView.tsx')
          s = p.read_text()
          original = s
          s = s.replace('activeMethod.category', 'activeMethod?.category')
          s = s.replace('activeMethod.name', "activeMethod?.name || selectedMethodId")
          marker = "  const activeCryptoWallet = cryptoWallets[selectedMethodId] || (selectedMethodId === 'usdt_trc20' ? cryptoWallets.usdt : null);"
          debug = marker + "\n\n  // Diagnostic logging: payment configuration can legitimately load asynchronously.\n  if (import.meta.env.DEV) console.debug('[FundsView] activeMethod:', activeMethod);"
          if "[FundsView] activeMethod:" not in s and marker in s:
              s = s.replace(marker, debug, 1)
          if s == original:
              print('No source changes required.')
          else:
              p.write_text(s)
              print('FundsView.tsx patched successfully.')
          PY

      - name: Commit and push patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/FundsView.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: prevent deposit crash when payment method is unavailable'
          git push origin HEAD:main
