name: Railway Postgres persistence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: "!contains(github.event.head_commit.message, '[postgres-persistence]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install PostgreSQL driver
        run: npm install pg@^8.16.3 --save
      - name: Wire Postgres into server
        run: node .github/scripts/wire-postgres.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server.ts .github/scripts/wire-postgres.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat: persist production records in Railway Postgres [postgres-persistence]"
          git push origin HEAD:main
