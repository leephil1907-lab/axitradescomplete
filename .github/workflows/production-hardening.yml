name: Production hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply production hardening
        run: node .github/scripts/production-hardening.mjs

      - name: Repair source integrity and email branding
        run: node .github/scripts/source-integrity-repair.mjs

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Startup smoke test
        run: |
          set -e
          npm start > /tmp/axitrades-start.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              echo "AxiTrades production server responded successfully."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axitrades-start.log
          exit 1

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Commit hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts server/adminAuth.ts server/emailService.ts src/utils/authHeaders.ts src/components/AdminFundingQueue.tsx src/components/AdminPaymentMethods.tsx src/hooks/useFirebaseData.ts src/firebase.ts src/components/SettingsView.tsx .github/scripts/production-hardening.mjs .github/scripts/source-integrity-repair.mjs
          git diff --cached --quiet || git commit -m "security: enforce server auth and branded email delivery"
          git push
