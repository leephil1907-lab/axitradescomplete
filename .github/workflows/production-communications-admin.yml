name: Production communications and admin controls

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production communications and admin changes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          email_service = r'''import nodemailer from 'nodemailer';

          function getTransporter() {
            const host = process.env.SMTP_HOST;
            const port = Number(process.env.SMTP_PORT || 587);
            const user = process.env.SMTP_USER;
            const pass = process.env.SMTP_PASS;
            if (!host || !user || !pass) return null;
            return nodemailer.createTransport({ host, port, secure: process.env.SMTP_SECURE === 'true', auth: { user, pass } });
          }

          const escapeHtml = (value: string) => value.replace(/[&<>'"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c] as string));

          export function renderAxiEmail(title: string, bodyHtml: string, preheader = '') {
            return `<!doctype html><html><body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#17202a"><div style="display:none;max-height:0;overflow:hidden">${escapeHtml(preheader)}</div><table width="100%" cellpadding="0" cellspacing="0" style="padding:32px 12px"><tr><td align="center"><table width="620" cellpadding="0" cellspacing="0" style="max-width:620px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.08)"><tr><td style="background:#111827;padding:26px 32px;color:#fff;font-size:24px;font-weight:700">Axi Trades</td></tr><tr><td style="padding:34px 32px"><h1 style="margin:0 0 18px;font-size:25px">${escapeHtml(title)}</h1>${bodyHtml}</td></tr><tr><td style="padding:20px 32px;background:#f8fafc;color:#64748b;font-size:12px">Axi Trades • This is an automated service message. Please do not reply to this email unless instructed.</td></tr></table></td></tr></table></body></html>`;
          }

          export async function sendAxiEmail(to: string, subject: string, title: string, bodyHtml: string, preheader?: string) {
            if (!to || !/^\S+@\S+\.\S+$/.test(to)) throw new Error('A valid recipient email is required');
            const transporter = getTransporter();
            if (!transporter) throw new Error('SMTP email service is not configured');
            const from = process.env.EMAIL_FROM || process.env.SMTP_USER;
            if (!from) throw new Error('EMAIL_FROM/SMTP_USER is not configured');
            await transporter.sendMail({ from, to, subject, html: renderAxiEmail(title, bodyHtml, preheader), text: `${title}\n\n${bodyHtml.replace(/<[^>]+>/g, ' ')}` });
          }
          '''
          Path('emailService.ts').write_text(email_service)

          p = Path('server.ts'); s = p.read_text()
          if "from './emailService'" not in s:
              s = s.replace("import nodemailer from 'nodemailer';", "import nodemailer from 'nodemailer';\nimport { sendAxiEmail } from './emailService';")
          marker = "// General Express JSON middleware for all other API routes\napp.use(express.json());"
          block = r'''// Production email endpoints. SMTP credentials stay on Railway/server; they are never shipped to the browser.
          app.post('/api/email/registration', async (req, res) => {
            try {
              const { email, name } = req.body || {};
              if (!email) return res.status(400).json({ error: 'Recipient email is required' });
              const safeName = String(name || 'Client').replace(/[<>]/g, '');
              await sendAxiEmail(String(email).trim().toLowerCase(), 'Welcome to Axi Trades', 'Welcome to Axi Trades', `<p>Hello ${safeName},</p><p>Your registration has been received successfully. Your account is currently being prepared for secure onboarding.</p><p>For your protection, account funding and trading access remain subject to the platform's verification and approval controls.</p><p>Regards,<br>Axi Trades Support</p>`);
              res.json({ success: true });
            } catch (e: any) { res.status(503).json({ error: e?.message || 'Email service unavailable' }); }
          });

          app.post('/api/admin/email', async (req, res) => {
            try {
              const adminKey = process.env.ADMIN_API_KEY;
              if (!adminKey || req.headers['x-admin-api-key'] !== adminKey) return res.status(401).json({ error: 'Unauthorized' });
              const { email, name, subject, title, message } = req.body || {};
              if (!email || !subject || !message) return res.status(400).json({ error: 'email, subject and message are required' });
              const safeName = String(name || 'Client').replace(/[<>]/g, '');
              const safeMessage = String(message).replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
              await sendAxiEmail(String(email).trim().toLowerCase(), String(subject), String(title || subject), `<p>Hello ${safeName},</p><p>${safeMessage}</p><p>Regards,<br>Axi Trades Support</p>`);
              res.json({ success: true });
            } catch (e: any) { res.status(503).json({ error: e?.message || 'Email service unavailable' }); }
          });

          ''' + marker
          if "app.post('/api/email/registration'" not in s:
              s = s.replace(marker, block)
          p.write_text(s)

          p = Path('src/hooks/useFirebaseData.ts'); s = p.read_text()
          old = re.compile(r"\s*// Trigger welcome email dispatch for new registration\n\s*const welcomeEmailPayload = \{.*?\n\s*\}, 1200\);", re.S)
          s, n = old.subn("\n              fetch('/api/email/registration', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, name }) })\n                .then(async (r) => { if (!r.ok) console.warn('Welcome email was not sent:', await r.text()); })\n                .catch((err) => console.warn('Welcome email request failed:', err));", s, count=1)
          s = s.replace("'Guest / Demo Trader'", "'Unauthenticated user'")
          s = s.replace("demoBalance: currPracticeBal,", "demoBalance: 0,")
          s = s.replace("accountNo: existingIndex >= 0 && userList[existingIndex].accountNo ? userList[existingIndex].accountNo : `AXI-MT5-${currentUser.uid.substring(0, 6).toUpperCase()}`,", "accountNo: existingIndex >= 0 ? (userList[existingIndex].accountNo || '') : '',")
          s = s.replace("accountType: 'Standard ECN Account',\n              leverage: '1:500',\n              country: 'International'", "accountType: existingIndex >= 0 ? (userList[existingIndex].accountType || '') : '',\n              leverage: existingIndex >= 0 ? (userList[existingIndex].leverage || '') : '',\n              country: existingIndex >= 0 ? (userList[existingIndex].country || '') : ''")
          p.write_text(s)

          p = Path('src/components/AdminDashboardView.tsx'); s = p.read_text()
          s = re.sub(r"  const defaultWallets = \{.*?\n  \};", "  const defaultWallets = {};", s, flags=re.S)
          s = re.sub(r"    return \{\n      instructions: 'Please contact customer support via email to receive personalized bank wire routing instructions and account details for your deposit\.',\n      supportEmail: 'axicustomersupport@gmail.com'\n    \};", "    return { instructions: '', supportEmail: '' };", s)
          s = s.replace("  const saveBankSettings = () => {\n    safeStorage.setItem('axi_admin_bank_settings', JSON.stringify(bankSettings));\n    showToast('Bank instructions updated successfully.', 'success');\n  };", "  const saveBankSettings = async () => {\n    try { await setDoc(doc(db, 'system_config', 'bank_settings'), { ...bankSettings, updatedAt: Date.now() }, { merge: true }); safeStorage.setItem('axi_admin_bank_settings', JSON.stringify(bankSettings)); showToast('Bank payment details updated.', 'success'); } catch (e) { showToast('Unable to save bank details. Check admin permissions.', 'error'); }\n  };")
          s = s.replace("  const saveWalletSettings = () => {\n    safeStorage.setItem('axi_admin_wallet_settings', JSON.stringify(walletSettings));\n    showToast('Crypto wallet addresses updated successfully.', 'success');\n  };", "  const saveWalletSettings = async () => {\n    try { await setDoc(doc(db, 'system_config', 'wallets'), { ...walletSettings, updatedAt: Date.now() }, { merge: true }); safeStorage.setItem('axi_admin_wallet_settings', JSON.stringify(walletSettings)); showToast('Crypto payment details updated.', 'success'); } catch (e) { showToast('Unable to save wallet details. Check admin permissions.', 'error'); }\n  };")
          s = s.replace("const demoBal = Number(data.balance ?? 10000);", "const demoBal = Number(data.balance ?? 0);")
          s = s.replace("const pnlPerc = Number(data.pnlPercentage ?? data.pnlOverride?.pnlPercentage ?? 24.5);", "const pnlPerc = Number(data.pnlPercentage ?? data.pnlOverride?.pnlPercentage ?? 0);")
          s = s.replace("accountNo: data.accountNo || `AXI-MT5-${uid.substring(0, 6).toUpperCase()}`,", "accountNo: data.accountNo || '',")
          s = s.replace("accountType: data.accountType || 'Pro ECN Prime',", "accountType: data.accountType || '',")
          s = s.replace("leverage: data.leverage || '1:500',", "leverage: data.leverage || '',")
          s = s.replace("country: data.country || 'International'", "country: data.country || ''")
          p.write_text(s)
          PY

      - name: Install PostgreSQL driver
        run: npm install pg --save

      - name: Apply PostgreSQL funding persistence
        run: node .github/scripts/finish-postgres-funding.mjs

      - name: Validate production build
        run: npm ci && npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emailService.ts server.ts src/components/AdminDashboardView.tsx src/hooks/useFirebaseData.ts package.json package-lock.json .github/scripts/finish-postgres-funding.mjs
          if git diff --cached --quiet; then echo "No changes required"; else git commit -m "feat: persist admin funding and payment settings [postgres-funding]"; git push origin main; fi
