name: Apply Stripe admin funding wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[stripe-admin-funding]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply wiring
        run: node .github/scripts/apply-stripe-admin-funding.mjs
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/components/AdminDashboardView.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: add Stripe manual funding review [stripe-admin-funding]"
          git push origin HEAD:main
