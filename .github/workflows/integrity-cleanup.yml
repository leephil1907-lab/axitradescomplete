name: Production integrity cleanup

on:
  push:
    branches: [production-integrity-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-integrity-cleanup
          fetch-depth: 0

      - name: Apply production integrity fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # App
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace("import { ASSET_METADATA, DEFAULT_MARKET_QUOTES } from './data';", "import { ASSET_METADATA } from './data';")
          s = re.sub(r"// Real-time market quote shells.*?const DEFAULT_CLOSED_POSITIONS", "// Price shells contain metadata only. liveMarketFeed supplies all prices.\nconst INITIAL_QUOTES: Record<string, MarketQuote> = Object.entries(ASSET_METADATA).reduce((acc, [symbol, meta]) => {\n  acc[symbol] = { symbol, name: meta.name, category: meta.category, price: 0, change: 0, bidDiff: undefined, askDiff: undefined, spread: 0, history: [], lastUpdated: 0, stale: true, status: 'unavailable' };\n  return acc;\n}, {} as Record<string, MarketQuote>);\n\nconst DEFAULT_CLOSED_POSITIONS", s, flags=re.S)
          s = s.replace("const eurusdRate = quotes['EURUSD']?.price || DEFAULT_MARKET_QUOTES['EURUSD']?.price || 1.0482;", "const eurusdRate = quotes['EURUSD']?.price || 0;")
          s = s.replace("const gbpusdRate = quotes['GBPUSD']?.price || DEFAULT_MARKET_QUOTES['GBPUSD']?.price || 1.2590;", "const gbpusdRate = quotes['GBPUSD']?.price || 0;")
          s = s.replace("    EUR: 1 / eurusdRate,\n    GBP: 1 / gbpusdRate,", "    EUR: eurusdRate > 0 ? 1 / eurusdRate : 0,\n    GBP: gbpusdRate > 0 ? 1 / gbpusdRate : 0,")
          s = s.replace("    const rate = currencyRates[targetCurrency] || 1.0;", "    const rate = currencyRates[targetCurrency];\n    if (!Number.isFinite(rate) || rate <= 0) return usdAmount;")
          s = s.replace("accountNo: user.accountNo || 'AXI-MT5-882910',", "accountNo: user.accountNo || '',")
          s = s.replace("accountType: user.accountType || 'Pro ECN Prime',", "accountType: user.accountType || '',")
          s = s.replace("status: user.status || user.verificationStatus || 'Verified'", "status: user.status || user.verificationStatus || 'Pending'")
          p.write_text(s)

          # Accounts / registration
          p = Path('src/components/AccountsView.tsx')
          s = p.read_text()
          s = re.sub(r"const \[subAccountsList, setSubAccountsList\] = useState\(\[.*?\]\);", "const [subAccountsList, setSubAccountsList] = useState<any[]>([]);", s, flags=re.S)
          s = re.sub(r"  const handleCreateSubAccount = \(e: React\.FormEvent\) => \{.*?\n  \};", "  const handleCreateSubAccount = (e: React.FormEvent) => {\n    e.preventDefault();\n    setIsCreatingSubAccount(false);\n    showToast('Sub-account request recorded. A broker-side account must be provisioned before credentials are issued.', 'info');\n  };", s, flags=re.S)
          s = s.replace("country: 'Nigeria',", "country: '',")
          s = s.replace("    'Axi Select': true, // checked by default", "    'Axi Select': false,")
          s = re.sub(r"\n  // Authenticator manual code generated for copying\n  const authSetupCode = '[^']+';", "", s)
          s = re.sub(r"\n      // Trigger official Registration Welcome Email notification from Axi Trades.*?\n      window\.dispatchEvent\(new CustomEvent\('axi_email_trigger', \{ detail: emailPayload \}\)\);\n", "\n", s, flags=re.S)
          s = s.replace("const validateAndNext = () => {", "const validateAndNext = async () => {")
          old = re.search(r"      // Currency & Leverage - Submit and finalize!.*?      showToast\('Live Axi ECN Account configured successfully! Finalizing settings\.\.\.', 'success'\);\n      setWizardStep\(15\);", s, flags=re.S)
          if old:
              new = """      // Final application step: create the real Firebase identity first. Broker credentials are never fabricated in the browser.\n      try {\n        const displayName = formData.firstName ? `${formData.firstName} ${formData.lastName}`.trim() : formData.email.split('@')[0];\n        const userCred = await createUserWithEmailAndPassword(auth, formData.email.trim().toLowerCase(), formData.password);\n        await updateProfile(userCred.user, { displayName });\n        const newUserPayload = {\n          id: userCred.user.uid, uid: userCred.user.uid, name: displayName,\n          email: formData.email.trim().toLowerCase(), country: formData.country,\n          status: 'Pending', verificationStatus: 'Pending', kycStatus: 'NOT_STARTED',\n          balance: 0, liveBalance: 0, accountNo: '',\n          accountType: `${formData.accountType} — awaiting broker provisioning`,\n          tradingPlatform: formData.tradingPlatform, leverage: formData.leverage, currency: formData.currency,\n          employment: formData.employment, avgIncome: formData.avgIncome, savingsValue: formData.savingsValue,\n          sourceFunds: formData.sourceFunds, authMethod: formData.authMethod, registeredAt: new Date().toISOString()\n        };\n        const response = await fetch('/api/users/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newUserPayload) });\n        if (!response.ok) throw new Error('The registration service did not accept the new account record.');\n        setGeneratedAccount(null);\n        showToast('Registration completed. Your application is pending KYC/admin review; broker credentials will only appear after real provisioning.', 'success');\n        setWizardStep(15);\n      } catch (err: any) {\n        showToast((err?.message || 'Unable to complete registration. Please try again.').replace('Firebase: ', ''), 'error');\n      }"""
              s = s[:old.start()] + new + s[old.end():]
          s = s.replace("onClick={() => setWizardStep(16)}", "onClick={() => { showToast('Broker credentials are issued only after real backend provisioning.', 'info'); }}")
          s = re.sub(r"\n            \{wizardStep === 16 && generatedAccount && \(.*?\n            \)\}\n", "\n", s, flags=re.S)
          s = s.replace("Explore MT4, MT5, or Axi's own platform", "Application submitted — provisioning pending")
          s = s.replace("Now on Web and App with crypto perps and more. Complete your setup by checking your credentials or trading directly in-platform.", "Your identity has been registered. Complete KYC and wait for administrator/broker approval before live trading credentials are issued.")
          s = s.replace("View Account Credentials", "View application status")
          s = s.replace("showToast('Launching custom cloud-native Axi Webtrader terminal...', 'success');", "showToast('Live trading access is available only after verified account provisioning.', 'info');")
          s = s.replace("demoBalance: 10000,", "demoBalance: 0,")
          p.write_text(s)

          # Authentication: failed login never creates an account.
          p = Path('src/hooks/useFirebaseData.ts')
          s = p.read_text()
          s = re.sub(r"  const loginWithEmail = async \(email: string, pass: string\) => \{.*?\n  \};\n\n  const logout", """  const loginWithEmail = async (email: string, pass: string) => {\n    const res = await signInWithEmailAndPassword(auth, email.trim().toLowerCase(), pass);\n    sendTelegramAlert('USER_LOGIN', '🔓 User Signed In via Email/Password', { 'Email': email.trim().toLowerCase(), 'User UID': res.user.uid });\n    return res;\n  };\n\n  const logout""", s, flags=re.S)
          p.write_text(s)

          # Dashboard: no synthetic quote or browser-side trade execution.
          p = Path('src/components/DashboardView.tsx')
          s = p.read_text()
          s = s.replace("import { DEFAULT_MARKET_QUOTES } from '../data';", "")
          s = re.sub(r"    // Default fallback quote\n    const fallbackPrice = .*?\n    return \{\n      price: fallbackPrice,\n      bid: fallbackPrice - 0\.0002,\n      ask: fallbackPrice \+ 0\.0002,\n      spreadPips: activeInstrument\.baseSpread,\n      change: DEFAULT_MARKET_QUOTES\[selectedSymbol\]\?\.change \?\? 0\.24,\n      high: fallbackPrice \* 1\.005,\n      low: fallbackPrice \* 0\.995\n    \};", "    return { price: 0, bid: 0, ask: 0, spreadPips: 0, change: 0, high: 0, low: 0 };", s, flags=re.S)
          s = re.sub(r"const price = raw\?\.price \|\| DEFAULT_MARKET_QUOTES\[inst\.symbol\]\?\.price \|\| \(inst\.symbol === 'EURUSD' \? 1\.0482 : inst\.symbol === 'BTCUSD' \? 96450 : 2915\.40\);", "const price = raw?.price || 0;", s)
          s = s.replace("const spreadVal = raw?.askDiff || inst.baseSpread * 0.0001;", "const spreadVal = typeof raw?.askDiff === 'number' ? raw.askDiff : 0;")
          s = s.replace("const bid = raw?.bid || (price - spreadVal / 2);", "const bid = typeof raw?.bid === 'number' ? raw.bid : (price > 0 ? price - spreadVal / 2 : 0);")
          s = s.replace("const ask = raw?.ask || (price + spreadVal / 2);", "const ask = typeof raw?.ask === 'number' ? raw.ask : (price > 0 ? price + spreadVal / 2 : 0);")
          s = s.replace("const change = raw?.change ?? DEFAULT_MARKET_QUOTES[inst.symbol]?.change ?? 0.12;", "const change = typeof raw?.change === 'number' ? raw.change : 0;")
          s = re.sub(r"  // Execute Market Order\n  const handleExecuteMarketOrder = .*?\n  };\n\n  // Place Pending Order", """  const handleExecuteMarketOrder = (_type: 'BUY' | 'SELL') => {\n    showToast('Order not submitted: no verified broker execution gateway is connected. No simulated fill was created.', 'error');\n  };\n\n  // Place Pending Order""", s, flags=re.S)
          s = re.sub(r"  // Place Pending Order\n  const handlePlacePendingOrder = .*?\n  };", """  const handlePlacePendingOrder = (e: React.FormEvent) => { e.preventDefault(); showToast('Pending orders require a verified broker execution gateway.', 'error'); };""", s, flags=re.S)
          s = re.sub(r"  // Close Open Position\n  const handleClosePosition = .*?\n  };", """  const handleClosePosition = (_posId: string) => { showToast('Position closing requires the verified broker execution gateway. No local balance mutation was performed.', 'error'); };""", s, flags=re.S)
          s = re.sub(r"  // Bulk Close All Positions\n  const handleCloseAllPositions = .*?\n  };", """  const handleCloseAllPositions = () => { showToast('Bulk close requires the verified broker execution gateway.', 'error'); };""", s, flags=re.S)
          s = re.sub(r"\n              <button\n                type=\"button\"\n                onClick=\{\(\) => setAccountMode\('demo'\)\}.*?\n              </button>", "", s, flags=re.S)
          s = s.replace("AxiCorp-Live MT5", "Broker execution connection")
          s = s.replace("(12ms • STP)", "(provider status)")
          s = s.replace("Live ECN (#8849201)", "Live account")
          s = s.replace("Leverage: <strong className=\"text-slate-200 font-mono\">1:500</strong>", "Leverage: <strong className=\"text-slate-200 font-mono\">Provider controlled</strong>")
          s = s.replace("onClick={() => setOneClickTrading(!oneClickTrading)}", "onClick={() => showToast('1-Click trading is disabled until broker execution is verified.', 'info')}")
          p.write_text(s)

          # Server: remove fabricated webhook status and financial defaults.
          p = Path('server.ts')
          s = p.read_text()
          s = re.sub(r"const webhookPingState = \{.*?\n\};", """const webhookPingState = {\n  lastPingTimestamp: 0,\n  lastPingEvent: 'none',\n  lastPingStatus: 'Disconnected' as 'Active' | 'Disconnected',\n  lastPingLatencyMs: 0,\n  lastPingSource: 'No verified webhook activity yet',\n  totalPingsCount: 0,\n  history: [] as WebhookPingEntry[]\n};""", s, flags=re.S)
          s = s.replace("demoBalance: typeof body.demoBalance === 'number' ? body.demoBalance : 10000,", "demoBalance: typeof body.demoBalance === 'number' ? body.demoBalance : 0,")
          s = s.replace("pnlPercentage: typeof body.pnlPercentage === 'number' ? body.pnlPercentage : 24.5,", "pnlPercentage: typeof body.pnlPercentage === 'number' ? body.pnlPercentage : 0,")
          s = s.replace("pnlOverride: body.pnlOverride || null,", "pnlOverride: null,")
          s = s.replace("accountNo: body.accountNo || `AXI-${body.tradingPlatform || 'MT5'}-${Math.floor(1000000 + Math.random() * 8999999)}`,", "accountNo: body.accountNo || '',")
          s = s.replace("accountType: body.accountType || `${body.tier || 'Standard'} Live`,", "accountType: body.accountType || 'Pending broker provisioning',")
          s = s.replace("leverage: body.leverage || '1:500',", "leverage: body.leverage || '',")
          s = s.replace("tradingPassword: body.tradingPassword || '',", "tradingPassword: '',")
          s = re.sub(r"let appBotConfigStore: any = readDataFile\('adminBotConfig\.json', \{.*?\}\);", "let appBotConfigStore: any = readDataFile('adminBotConfig.json', { active: false, name: '', strategy: '', frequency: '', maxAllocationUsd: 0, winRateSim: 0, monthlyTargetYield: 0, riskLevel: 'Disabled' });", s, flags=re.S)
          s = re.sub(r"let appTradingBotSettingsStore: any = readDataFile\('adminTradingBotSettings\.json', \{.*?\}\);", "let appTradingBotSettingsStore: any = readDataFile('adminTradingBotSettings.json', { automatedTradingEnabled: false, maxBotLeverage: '', circuitBreakerEnabled: true, circuitBreakerThreshold: 0 });", s, flags=re.S)
          s = re.sub(r"let appInvestmentPlansStore: any\[\] = readDataFile\('adminInvestmentPlans\.json', \[.*?\]\);", "let appInvestmentPlansStore: any[] = readDataFile('adminInvestmentPlans.json', []);", s, flags=re.S)
          s = re.sub(r"let appTradingPairsStore: any\[\] = readDataFile\('adminTradingPairs\.json', \[.*?\]\);", "let appTradingPairsStore: any[] = readDataFile('adminTradingPairs.json', []);", s, flags=re.S)
          s = re.sub(r"let appCurrenciesStore: any\[\] = readDataFile\('adminCurrencies\.json', \[.*?\]\);", "let appCurrenciesStore: any[] = readDataFile('adminCurrencies.json', []);", s, flags=re.S)
          for route in ["app.post('/api/stripe/webhook/ping'", "app.post('/api/stripe/webhook/toggle-disconnect'"]:
              idx = s.find(route)
              if idx >= 0:
                  body_start = s.find('{', idx)
                  guard = "\n  if (process.env.NODE_ENV === 'production') return res.status(404).json({ error: 'Test endpoint disabled in production.' });"
                  if body_start >= 0 and guard not in s[body_start:body_start+250]: s = s[:body_start+1] + guard + s[body_start+1:]
          p.write_text(s)

          # Admin dashboard: realtime Firebase users. Firestore rules restrict this to admins.
          p = Path('src/components/AdminDashboardView.tsx')
          s = p.read_text()
          if "Realtime registered-user directory" not in s:
              marker = "  // Sync with safeStorage\n"
              addition = """  // Realtime registered-user directory.\n  useEffect(() => {\n    const unsubscribe = onSnapshot(collection(db, 'users'), (snapshot) => {\n      const liveUsers = snapshot.docs.map(item => {\n        const data = item.data() as any;\n        return { id: item.id, name: data.displayName || data.name || data.email?.split('@')[0] || 'Trader', email: data.email || '', status: data.kycStatus === 'VERIFIED' ? 'Verified' : (data.status || 'Pending'), kycStatus: data.kycStatus || 'NOT_STARTED', balance: Number(data.liveBalance || 0), demoBalance: Number(data.balance || 0), registeredAt: data.createdAt ? new Date(data.createdAt).toISOString() : new Date().toISOString(), lastActive: new Date().toISOString() };\n      });\n      setRecentUsers(liveUsers);\n    }, (error) => console.warn('Realtime admin user directory unavailable:', error));\n    return () => unsubscribe();\n  }, []);\n\n"""
              if marker in s: s = s.replace(marker, addition + marker)
          p.write_text(s)

          print('Final production integrity cleanup completed.')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/AccountsView.tsx src/hooks/useFirebaseData.ts src/components/AdminDashboardView.tsx src/components/DashboardView.tsx server.ts
          git diff --cached --quiet || git commit -m "Finalize production-only data and admin registration flow"
          git push origin production-integrity-cleanup
