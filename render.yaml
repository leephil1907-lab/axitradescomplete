services:
  - type: web
    name: axitrades
    runtime: docker
    plan: pro
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/markets/quotes
    autoDeploy: true
    # Persistent disk (Render Pro): keeps the runtime data store
    # (server-side /app/data fallback store: users.json, KYC uploads, etc.)
    # alive across deploys and restarts.
    disk:
      name: axitrades-data
      sizeInGb: 10
      mountPath: /app/data
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: APP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
