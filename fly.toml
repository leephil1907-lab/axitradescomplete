# fly.toml — Fly.io configuration for Axi Trades
# Generated for deployment via: fly deploy

app = "axitrades"
primary_region = "iad"  # Washington, D.C. — change to your nearest region (lhr=London, sin=Singapore, syd=Sydney)

[build]
  # Uses the existing Dockerfile in the repo root
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep running so live price feeds stay active
  auto_start_machines = true
  min_machines_running = 1     # always-on: 1 machine minimum so API is never cold

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 500

# Health check — confirms the Express server + live API are responding
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/api/markets/quotes"

# Resource sizing — 512MB is enough for the Express server + live price feeds
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
